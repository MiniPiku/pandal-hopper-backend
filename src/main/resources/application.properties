spring.application.name=Pandal-Hopperv2

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
jwt.Secret-Key=${jwt-Secret-Key}

spring.security.oauth2.client.registration.google.client-id=${oauth2-google-clientId}
spring.security.oauth2.client.registration.google.client-secret=${oauth2-google-clientSecret}

spring.data.redis.url=${REDIS_URL}
spring.data.redis.ssl.enabled=true

# Fail fast when Redis is unreachable. Lettuce defaults to a 60s command
# timeout, so without these the DB fallback still leaves every request hanging
# for a minute before it engages - the outage looks like a hang, not a miss.
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s

spring.docker.compose.enabled=true

# ---------- Application ----------
# Plain literals only. Do NOT write these as ${app.foo:default} - a placeholder
# naming its own key is a circular reference and fails context startup.
# Overriding is already handled by property-source precedence: an OS env var
# (APP_FRONTEND_CALLBACK_URL), a -D flag, or application-<profile>.properties
# all win over this file.

# Where OAuth2 login redirects after issuing a single-use exchange code.
app.frontend.callback-url=https://pandal-hopper.vercel.app/auth/callback

# Comma-separated CORS origin allowlist. Replaces the former @CrossOrigin("*").
app.cors.allowed-origins=https://pandal-hopper.vercel.app